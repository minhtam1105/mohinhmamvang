
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
</script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.mam-scene {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 500px;
  overflow: hidden;

  background-image: url(
    "https://minhtam1105.github.io/mohinhmamvang/58a35655-4e21-4cd1-9e70-410d81edee08.png"
  );

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

model-viewer {
  width: 100%;
  height: 100%;
  background: transparent;
  --poster-color: transparent;
}

@media (max-width: 600px) {
  .mam-scene {
    height: 600px;
  }
}
</style>
</head>

<body>

<div class="mam-scene">

  <model-viewer
    src="https://minhtam1105.github.io/mohinhmamvang/tripo_convert_97f55304-c274-42ca-a542-a0e8d2c14b96.glb"

    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="12deg"

    shadow-intensity="1"
    tone-mapping="neutral"
    exposure="1"

    camera-orbit="0deg 75deg 105%"
    interaction-prompt="none"

    loading="eager">
  </model-viewer>

</div>

</body>
</html>
